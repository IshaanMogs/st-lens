[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stlens"
version = "0.0.1"
description = "Research prototype scoring spoof-like patterns in limit order books with spatial-temporal models."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ishaan Kumar" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Private :: Do Not Upload",
]
# Core: data layer (canonical events, validation, Parquet storage, configs).
# Heavy stacks live in extras so each phase installs only what it needs.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pandera>=0.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 1: Binance WebSocket recorder + REST depth snapshots.
ingest = [
    "websockets>=12",
    "httpx>=0.27",
]
# Phases 6-9: models and training.
# PyTorch: CPU wheels are sufficient; code must stay device-agnostic so CUDA works later.
ml = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
# Deferred in the fast-track prototype: experiment tracking and TreeSHAP.
tracking = [
    "mlflow>=2.12",
    "shap>=0.45",
]
# Phase 11: read-only dashboard.
dashboard = [
    "streamlit>=1.33",
    "plotly>=5.20",
]
dev = [
    "ruff==0.16.10",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stlens"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PT",      # pytest style
    "DTZ",     # naive datetimes: all ST-LENS timestamps must be timezone-aware UTC
    "NPY",     # numpy
    "T20",     # stray print() in library code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PT018"]
"src/stlens/report.py" = ["E501"]  # Markdown table literals
"scripts/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "leakage: data-leakage guard tests (spec section J)",
    "integration: small end-to-end tests on a fixture day",
    "slow: long-running tests",
]
